<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>連携の確認 | AIであそぼ</title>
<style>:root{--bg:#fff;--fg:#222;--sub:#666;--ac:#2b6cb0}@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#e8e8e8;--sub:#aaa;--ac:#7ab3ef}}
body{background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.8;max-width:720px;margin:0 auto;padding:24px 16px}
a{color:var(--ac)}nav{font-size:.9em;color:var(--sub);margin-bottom:24px}footer{margin-top:40px;font-size:.85em;color:var(--sub)}code{word-break:break-all;font-size:1.05em}</style></head><body>
<nav><a href="./">ホーム</a> ・ <a href="privacy.html">プライバシーポリシー</a> ・ <a href="terms.html">利用規約</a></nav><h1>連携の確認</h1>
<p id="msg">読み込み中…</p>
<p><code id="code"></code></p>
<button id="copy" hidden>コピーする</button>
<script>
const p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');
const m=document.getElementById('msg'),k=document.getElementById('code'),b=document.getElementById('copy');
if(c){m.textContent='許可できました。下の文字をコピーして Claude に渡してください。';k.textContent=c;b.hidden=false;
b.onclick=()=>{navigator.clipboard.writeText(c).then(()=>b.textContent='コピーしました')}}
else if(e){m.textContent='許可されませんでした: '+e+' '+(p.get('error_description')||'')}
else{m.textContent='このページは、各サービスで「許可」を押したあとに戻ってくるためのページです。'}
</script><footer>AIであそぼ ・ お問い合わせ: kaihatu.develop@gmail.com</footer></body></html>
